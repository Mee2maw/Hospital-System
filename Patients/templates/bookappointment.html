
{% extends 'base.html' %}

{% block title %}Book Appointment{% endblock %}

{% block content %}

<header>
    <h1>Welcome to Our Booking Page</h1>
    <p>Schedule your appointment with us today!</p>
</header>

<hr>

<main>
    <h2>Book an Appointment 📅</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Full Name:</label><br>
        <input type="text" name="full_name" placeholder="Enter your name" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" placeholder="Enter your email" required><br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phone" placeholder="Enter phone number"><br><br>

        <label>Appointment Date:</label><br>
        <input type="date" name="appointment_date" required><br><br>

        <label>Select Service:</label><br>
        <select name="service">
            <option>Consultation</option>
            <option>General Check-up</option>
            <option>Follow-up</option>
        </select><br><br>

        <label>Additional Information:</label><br>
        <textarea name="message" rows="3" placeholder="Your message..."></textarea><br><br>

        <button type="submit">Book Now</button>
        <button type="reset">Clear</button>
    </form>
</main>

<hr>

<footer>
    <p>&copy; 2026 Appointment Booking. All Rights Reserved.</p>
</footer>

{% endblock %}
